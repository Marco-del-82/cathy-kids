server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:wav|mp3|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Video streaming & iOS Byte-Range partial content support
    # CRITICAL: Cloudflare Edge Cache buffers video and converts 206 Partial Content into 200 OK with Weak ETag,
    # which immediately breaks Apple iOS AVPlayer / Safari video playback.
    # By setting "no-cache, private, no-transform", Cloudflare bypasses its edge cache and streams byte-ranges directly from Nginx origin.
    location ~* \.(?:mp4|webm|m4v|mov)$ {
        gzip off;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;

        add_header Cache-Control "no-cache, private, no-transform" always;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin * always;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
}
